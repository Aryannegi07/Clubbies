spring:
  application:
    name: clubbies-api
  datasource:
    url: jdbc:postgresql://localhost:5432/Clubbies
    username: postgres
    password: ClubSecure2026!
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc: 
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        name: CLUBBIES_SESSION
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  timezone: Asia/Kolkata
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Platform Administrator}
